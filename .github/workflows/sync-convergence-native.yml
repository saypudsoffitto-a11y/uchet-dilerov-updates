name: Native three-client totals convergence
on:
  pull_request:
    paths:
      - 'app/**'
      - 'server/**'
      - 'scripts/native-sync-three-clients.cjs'
      - '.github/workflows/sync-convergence-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install server dependencies
        working-directory: server
        run: npm install --no-audit --no-fund
      - name: Install app dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Run three-client financial convergence scenario
        run: xvfb-run -a node app/node_modules/electron/cli.js scripts/native-sync-three-clients.cjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-convergence-native
          path: qa-sync-probe/native-three
          if-no-files-found: warn
