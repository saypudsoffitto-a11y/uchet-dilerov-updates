name: Build Windows 8.9.17 installer

on:
  push:
    branches:
      - work-8.9.17-fixes
    paths:
      - 'BUILD_TEST_TRIGGER.txt'
      - '.github/workflows/build-test.yml'
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Build Windows Setup and Portable
        working-directory: app
        run: npm run build:win

      - name: Verify outputs
        shell: pwsh
        run: |
          $version = node -p "require('./app/package.json').version"
          $setup = "app/dist/Uchet-dilerov-Setup-$version-x64.exe"
          $portable = "app/dist/Uchet-dilerov-Portable-$version-x64.exe"
          if (!(Test-Path $setup)) { throw "Setup missing: $setup" }
          if (!(Test-Path $portable)) { throw "Portable missing: $portable" }
          Write-Host "Verified $setup"
          Write-Host "Verified $portable"

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Uchet-dilerov-8.9.17-Windows-x64
          path: |
            app/dist/Uchet-dilerov-Setup-8.9.17-x64.exe
            app/dist/Uchet-dilerov-Portable-8.9.17-x64.exe
          if-no-files-found: error
          retention-days: 14
