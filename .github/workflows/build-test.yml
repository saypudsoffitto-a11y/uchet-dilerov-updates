name: Build and publish corrected Windows 8.9.17

on:
  push:
    branches:
      - work-8.9.17-fixes
    paths:
      - 'BUILD_TEST_TRIGGER.txt'
      - '.github/workflows/build-test.yml'
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Build Windows Setup and Portable
        working-directory: app
        run: npm run build:win

      - name: Verify outputs
        shell: pwsh
        run: |
          $version = node -p "require('./app/package.json').version"
          if ($version -ne '8.9.17') { throw "Expected package version 8.9.17, got $version" }
          $setup = "app/dist/Uchet-dilerov-Setup-$version-x64.exe"
          $portable = "app/dist/Uchet-dilerov-Portable-$version-x64.exe"
          if (!(Test-Path $setup)) { throw "Setup missing: $setup" }
          if (!(Test-Path $portable)) { throw "Portable missing: $portable" }
          Write-Host "Verified $setup"
          Write-Host "Verified $portable"

      - name: Create temporary rollback manifest
        shell: pwsh
        run: |
          $setup = "app/dist/Uchet-dilerov-Setup-8.9.17-x64.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          $manifest = [ordered]@{
            version = '8.9.18.1'
            url = 'https://github.com/saypudsoffitto-a11y/uchet-dilerov-updates/releases/download/8.9.17-final/Uchet-dilerov-Setup-8.9.17-x64.exe'
            sha256 = $hash
            notes = 'Временное восстановительное обновление: устанавливает исправленную версию 8.9.17 поверх ошибочно установленной 8.9.18. Данные учёта сохраняются.'
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Path latest.json -Encoding utf8
          Get-Content latest.json

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Uchet-dilerov-8.9.17-Windows-x64
          path: |
            app/dist/Uchet-dilerov-Setup-8.9.17-x64.exe
            app/dist/Uchet-dilerov-Portable-8.9.17-x64.exe
            latest.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish corrected 8.9.17 as latest rollback release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '8.9.17-final'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes --cleanup-tag
          }
          gh release create $tag `
            "app/dist/Uchet-dilerov-Setup-8.9.17-x64.exe" `
            "app/dist/Uchet-dilerov-Portable-8.9.17-x64.exe" `
            "latest.json" `
            --title "Учёт дилеров 8.9.17 — исправленная" `
            --notes "Исправленная сборка 8.9.17. Этот выпуск временно назначен последним, чтобы кнопка обновления на ошибочной 8.9.18 установила именно 8.9.17." `
            --latest
