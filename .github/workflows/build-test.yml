name: Build and publish audited Windows 8.9.26

on:
  push:
    branches:
      - work-8.9.17-fixes
    paths:
      - 'BUILD_TEST_TRIGGER.txt'
      - '.github/workflows/build-test.yml'
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Verify all JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem app -Filter *.js | ForEach-Object {
            Write-Host "Checking $($_.Name)"
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $($_.Name)" }
          }

      - name: Run NewMatRos multi-ceiling audit
        run: node app/smoke-audit.js

      - name: Build Windows Setup and Portable
        working-directory: app
        run: npm run build:win

      - name: Verify outputs
        shell: pwsh
        run: |
          $version = node -p "require('./app/package.json').version"
          if ($version -ne '8.9.26') { throw "Expected package version 8.9.26, got $version" }
          $setup = "app/dist/Uchet-dilerov-Setup-$version-x64.exe"
          $portable = "app/dist/Uchet-dilerov-Portable-$version-x64.exe"
          if (!(Test-Path $setup)) { throw "Setup missing: $setup" }
          if (!(Test-Path $portable)) { throw "Portable missing: $portable" }
          Write-Host "Verified $setup"
          Write-Host "Verified $portable"

      - name: Create update manifest
        shell: pwsh
        run: |
          $setup = "app/dist/Uchet-dilerov-Setup-8.9.26-x64.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          $manifest = [ordered]@{
            version = '8.9.26'
            url = 'https://github.com/saypudsoffitto-a11y/uchet-dilerov-updates/releases/download/8.9.26-audited/Uchet-dilerov-Setup-8.9.26-x64.exe'
            sha256 = $hash
            notes = 'NewMatRos: несколько потолков одного дилера автоматически накапливаются в одной открытой продаже. Продажа, чек и долг создаются один раз только после кнопки закрытия продажи.'
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Path latest.json -Encoding utf8
          Get-Content latest.json

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Uchet-dilerov-8.9.26-Windows-x64
          path: |
            app/dist/Uchet-dilerov-Setup-8.9.26-x64.exe
            app/dist/Uchet-dilerov-Portable-8.9.26-x64.exe
            latest.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish audited 8.9.26 as latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '8.9.26-audited'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes --cleanup-tag
          }
          gh release create $tag `
            "app/dist/Uchet-dilerov-Setup-8.9.26-x64.exe" `
            "app/dist/Uchet-dilerov-Portable-8.9.26-x64.exe" `
            "latest.json" `
            --target "${{ github.sha }}" `
            --title "Учёт дилеров 8.9.26 — несколько потолков в одной продаже" `
            --notes "Первый потолок открывает продажу NewMatRos. Все последующие выгрузки этого же дилера автоматически добавляются в неё без кнопки «Добавить потолок». В карточке видны все потолки и общий итог. Долг и один общий чек создаются только после «Закрыть и оформить продажу». Повторный потолок блокируется; потолок другого дилера не смешивается с текущей продажей." `
            --latest
