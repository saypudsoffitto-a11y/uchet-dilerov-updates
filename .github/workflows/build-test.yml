name: Verify Windows build pipeline

on:
  pull_request:
    paths: ['app/**', 'tests/**', 'scripts/**', '.github/workflows/**']
  push:
    branches: [main]
    paths:
      - 'BUILD_TEST_TRIGGER.txt'
  workflow_dispatch:

concurrency:
  group: windows-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Windows updater handoff
        run: node scripts/windows-smoke.cjs --handoff-only

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Build Windows Setup and Portable
        working-directory: app
        run: npm run build:win -- --publish never

      - name: Verify outputs
        shell: pwsh
        run: |
          $version = node -p "require('./app/package.json').version"
          $setup = "app/dist/Uchet-dilerov-Setup-$version-x64.exe"
          $portable = "app/dist/Uchet-dilerov-Portable-$version-x64.exe"
          if (!(Test-Path $setup)) { throw "Setup missing: $setup" }
          if (!(Test-Path $portable)) { throw "Portable missing: $portable" }
          Write-Host "Verified $setup"
          Write-Host "Verified $portable"

      - name: Install and launch Windows application before publication
        shell: pwsh
        run: |
          $version = node -p "require('./app/package.json').version"
          $setup = (Resolve-Path "app/dist/Uchet-dilerov-Setup-$version-x64.exe").Path
          $destination = Join-Path $env:RUNNER_TEMP 'uchet-smoke-install'
          Write-Host 'Starting silent installation'
          $installer = Start-Process -FilePath $setup -ArgumentList @('/S', "/D=$destination") -PassThru
          if (!$installer.WaitForExit(60000)) { throw 'Installer did not finish in 60 seconds' }
          Write-Host 'Silent installation finished'
          if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }
          $exe = Join-Path $destination 'Учёт дилеров.exe'
          node scripts/windows-smoke.cjs "$exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


      - name: Upload checked Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: uchet-dilerov-windows-checked
          path: app/dist/*Setup*.exe
          retention-days: 7
