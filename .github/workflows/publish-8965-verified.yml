name: Build and publish Windows 8.9.65

on:
  push:
    branches:
      - fix-8965-backup-gate
    paths:
      - 'app/**'
      - 'tests/**'
      - 'scripts/**'
      - 'RELEASE_NOTES.md'
      - '.github/workflows/publish-8965-verified.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uchet-dilerov-8965-publish
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify release version
        shell: pwsh
        run: |
          $version = node -p "require('./app/package.json').version"
          if ($version -ne '8.9.65') { throw "Unexpected version: $version" }

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Run full regression suite
        working-directory: app
        run: npm run prebuild:win

      - name: Build Windows Setup and Portable
        working-directory: app
        shell: pwsh
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          npm run build:win -- --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install and smoke-test 8.9.65 twice
        shell: pwsh
        run: |
          $version = '8.9.65'
          $setup = (Resolve-Path "app/dist/Uchet-dilerov-Setup-$version-x64.exe").Path
          $exe = $null
          $lastExitCode = $null
          for ($attempt=1; $attempt -le 3; $attempt++) {
            $destination = Join-Path $env:RUNNER_TEMP "uchet-8965-install-$attempt"
            if (Test-Path $destination) { Remove-Item $destination -Recurse -Force -ErrorAction SilentlyContinue }
            $installer = Start-Process -FilePath $setup -ArgumentList @('/S', "/D=$destination") -PassThru
            if (!$installer.WaitForExit(90000)) {
              Stop-Process -Id $installer.Id -Force -ErrorAction SilentlyContinue
              $lastExitCode = 'timeout'
            } else {
              $lastExitCode = $installer.ExitCode
              $candidate = Join-Path $destination 'Учёт дилеров.exe'
              if ($lastExitCode -eq 0 -and (Test-Path $candidate)) { $exe = $candidate; break }
            }
            Start-Sleep -Seconds 3
          }
          if (!$exe) { throw "Installer failed after 3 attempts. Last exit code: $lastExitCode" }
          for ($pass=1; $pass -le 2; $pass++) {
            node scripts/windows-smoke.cjs "$exe"
            if ($LASTEXITCODE -ne 0) { throw "Windows UI smoke pass $pass failed" }
            node scripts/windows-group-filter-smoke.cjs "$exe"
            if ($LASTEXITCODE -ne 0) { throw "Group filter smoke pass $pass failed" }
            node scripts/windows-interface-smoke.cjs "$exe"
            if ($LASTEXITCODE -ne 0) { throw "Interface smoke pass $pass failed" }
            node scripts/windows-newmatros-smoke.cjs "$exe"
            if ($LASTEXITCODE -ne 0) { throw "NewMatRos smoke pass $pass failed" }
          }

      - name: Generate update manifest
        shell: pwsh
        run: |
          $version = '8.9.65'
          $setup = "app/dist/Uchet-dilerov-Setup-$version-x64.exe"
          $sha = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          $notes = (Get-Content 'RELEASE_NOTES.md' -Raw).Trim()
          $manifest = [ordered]@{
            version = $version
            url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$version/Uchet-dilerov-Setup-$version-x64.exe"
            sha256 = $sha
            notes = $notes
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Path 'latest.json' -Encoding utf8

      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '8.9.65'
          $files = @(
            "app/dist/Uchet-dilerov-Setup-$version-x64.exe",
            "app/dist/Uchet-dilerov-Portable-$version-x64.exe",
            "latest.json"
          )
          gh release view "$version" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$version" @files --repo "$env:GITHUB_REPOSITORY" --clobber
          } else {
            gh release create "$version" @files --repo "$env:GITHUB_REPOSITORY" --title "Учёт дилеров $version" --notes-file 'RELEASE_NOTES.md' --target "$env:GITHUB_SHA"
          }

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Uchet-dilerov-8.9.65-verified
          path: |
            app/dist/Uchet-dilerov-Setup-8.9.65-x64.exe
            app/dist/Uchet-dilerov-Portable-8.9.65-x64.exe
            latest.json
          retention-days: 7
