name: Validate 8.9.69 fixes

on:
  push:
    branches: [fix/8.9.69-newmatros-price-ui]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify version and syntax
        shell: pwsh
        run: |
          $version = node -p "require('./app/package.json').version"
          if ($version -ne '8.9.69') { throw "Unexpected version: $version" }
          node --check app/release-8969.js
          node --check app/preload.js
      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Run 8.9.69 targeted regression tests
        working-directory: app
        run: node --test ../tests/release-8969/*.test.cjs
      - name: Check 8.9.50
        working-directory: app
        run: node --test ../tests/release-8950/*.test.cjs
      - name: Check 8.9.51
        working-directory: app
        run: node --test ../tests/release-8951/*.test.cjs
      - name: Check 8.9.52
        working-directory: app
        run: node --test ../tests/release-8952/*.test.cjs
      - name: Check 8.9.53
        working-directory: app
        run: node --test ../tests/release-8953/*.test.cjs
      - name: Check 8.9.54
        working-directory: app
        run: node --test ../tests/release-8954/*.test.cjs
      - name: Check 8.9.55
        working-directory: app
        run: node --test ../tests/release-8955/*.test.cjs
      - name: Check 8.9.58
        working-directory: app
        run: node --test ../tests/release-8958/*.test.cjs
      - name: Check 8.9.59
        working-directory: app
        run: node --test ../tests/release-8959/*.test.cjs
      - name: Check 8.9.61
        working-directory: app
        run: node --test ../tests/release-8961/*.test.cjs
      - name: Check 8.9.62
        working-directory: app
        run: node --test ../tests/release-8962/*.test.cjs
      - name: Check 8.9.63
        working-directory: app
        run: node --test ../tests/release-8963/*.test.cjs
      - name: Check 8.9.64
        working-directory: app
        run: node --test ../tests/release-8964/*.test.cjs
      - name: Check 8.9.65
        working-directory: app
        run: node --test ../tests/release-8965/*.test.cjs
      - name: Check 8.9.66
        working-directory: app
        run: node --test ../tests/release-8966/*.test.cjs
      - name: Check 8.9.67
        working-directory: app
        run: node --test ../tests/release-8967/*.test.cjs
      - name: Check 8.9.68
        working-directory: app
        run: node --test ../tests/release-8968/*.test.cjs
      - name: Run production sequential regression suite
        working-directory: app
        run: npm run prebuild:win
