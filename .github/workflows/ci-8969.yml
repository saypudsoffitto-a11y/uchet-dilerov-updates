name: Validate 8.9.69 fixes

on:
  push:
    branches: [fix/8.9.69-newmatros-price-ui]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify version and syntax
        shell: pwsh
        run: |
          $version = node -p "require('./app/package.json').version"
          if ($version -ne '8.9.69') { throw "Unexpected version: $version" }
          node --check app/release-8969.js
          node --check app/preload.js
      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Run 8.9.69 regression tests
        working-directory: app
        run: node --test ../tests/release-8969/*.test.cjs
      - name: Check 8.9.61 regressions
        continue-on-error: true
        working-directory: app
        run: node --test ../tests/release-8961/*.test.cjs
      - name: Check 8.9.62 regressions
        continue-on-error: true
        working-directory: app
        run: node --test ../tests/release-8962/*.test.cjs
      - name: Check 8.9.63 regressions
        continue-on-error: true
        working-directory: app
        run: node --test ../tests/release-8963/*.test.cjs
      - name: Check 8.9.64 regressions
        continue-on-error: true
        working-directory: app
        run: node --test ../tests/release-8964/*.test.cjs
      - name: Check 8.9.65 regressions
        continue-on-error: true
        working-directory: app
        run: node --test ../tests/release-8965/*.test.cjs
      - name: Check 8.9.66 regressions
        continue-on-error: true
        working-directory: app
        run: node --test ../tests/release-8966/*.test.cjs
      - name: Check 8.9.67 regressions
        continue-on-error: true
        working-directory: app
        run: node --test ../tests/release-8967/*.test.cjs
      - name: Check 8.9.68 regressions
        continue-on-error: true
        working-directory: app
        run: node --test ../tests/release-8968/*.test.cjs
      - name: Run full regression suite
        working-directory: app
        run: npm run prebuild:win
