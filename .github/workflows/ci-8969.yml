name: Validate 8.9.69 fixes

on:
  push:
    branches: [fix/8.9.69-newmatros-price-ui]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify version and syntax
        shell: pwsh
        run: |
          $version = node -p "require('./app/package.json').version"
          if ($version -ne '8.9.69') { throw "Unexpected version: $version" }
          node --check app/release-8969.js
          node --check app/preload.js
      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Run 8.9.69 targeted regression tests
        working-directory: app
        run: node --test ../tests/release-8969/*.test.cjs
      - name: Check 8.9.40
        working-directory: app
        run: node --test ../tests/release-8940/*.test.cjs
      - name: Check 8.9.41
        working-directory: app
        run: node --test ../tests/release-8941/*.test.cjs
      - name: Check 8.9.42
        working-directory: app
        run: node --test ../tests/release-8942/*.test.cjs
      - name: Check 8.9.46
        working-directory: app
        run: node --test ../tests/release-8946/*.test.cjs
      - name: Check 8.9.47
        working-directory: app
        run: node --test ../tests/release-8947/*.test.cjs
      - name: Check 8.9.48
        working-directory: app
        run: node --test ../tests/release-8948/*.test.cjs
      - name: Check 8.9.49
        working-directory: app
        run: node --test ../tests/release-8949/*.test.cjs
      - name: Run production sequential regression suite
        working-directory: app
        run: npm run prebuild:win
