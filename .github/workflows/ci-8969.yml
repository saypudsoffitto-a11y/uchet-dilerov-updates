name: Validate 8.9.69 fixes

on:
  push:
    branches: [fix/8.9.69-newmatros-price-ui]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify version and syntax
        shell: pwsh
        run: |
          $version = node -p "require('./app/package.json').version"
          if ($version -ne '8.9.69') { throw "Unexpected version: $version" }
          node --check app/release-8969.js
          node --check app/preload.js
      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Run 8.9.69 regression tests
        working-directory: app
        run: node --test ../tests/release-8969/*.test.cjs
      - name: Check base regressions
        working-directory: app
        run: node --test ../tests/regressions/*.test.cjs
      - name: Check releases 8.9.29-8.9.39
        working-directory: app
        run: node --test ../tests/release-8929/*.test.cjs ../tests/release-8930/*.test.cjs ../tests/release-8931/*.test.cjs ../tests/release-8932/*.test.cjs ../tests/release-8934/*.test.cjs ../tests/release-8935/*.test.cjs ../tests/release-8936/*.test.cjs ../tests/release-8937/*.test.cjs ../tests/release-8938/*.test.cjs ../tests/release-8939/*.test.cjs
      - name: Check releases 8.9.40-8.9.49
        working-directory: app
        run: node --test ../tests/release-8940/*.test.cjs ../tests/release-8941/*.test.cjs ../tests/release-8942/*.test.cjs ../tests/release-8946/*.test.cjs ../tests/release-8947/*.test.cjs ../tests/release-8948/*.test.cjs ../tests/release-8949/*.test.cjs
      - name: Check releases 8.9.50-8.9.59
        working-directory: app
        run: node --test ../tests/release-8950/*.test.cjs ../tests/release-8951/*.test.cjs ../tests/release-8952/*.test.cjs ../tests/release-8953/*.test.cjs ../tests/release-8954/*.test.cjs ../tests/release-8955/*.test.cjs ../tests/release-8958/*.test.cjs ../tests/release-8959/*.test.cjs
      - name: Run full sequential regression suite
        working-directory: app
        run: npm run prebuild:win
