name: Stable Windows and macOS release
on:
  push:
    branches: [main]
    paths: ['STABLE_RELEASE_TRIGGER.txt']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: stable-release
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install server dependencies
        working-directory: server
        run: npm install --no-audit --no-fund
      - name: Install application dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Build Windows
        if: runner.os == 'Windows'
        working-directory: app
        run: npm run build:win -- --publish never
      - name: Build macOS
        if: runner.os == 'macOS'
        working-directory: app
        run: npm run build:mac -- --publish never
      - name: Check macOS signed bundle and launch
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app_path="app/dist/mac-arm64/UchetDilerov.app"
          codesign --verify --deep --strict "$app_path"
          node scripts/smoke-macos.cjs "$app_path"
      - name: Install and launch Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p "require('./app/package.json').version"
          $setup = (Resolve-Path "app/dist/Uchet-dilerov-Setup-$version-x64.exe").Path
          $destination = Join-Path $env:RUNNER_TEMP 'uchet-stable-install'
          $installer = Start-Process -FilePath $setup -ArgumentList @('/S', "/D=$destination") -PassThru
          if (!$installer.WaitForExit(120000) -or $installer.ExitCode -ne 0) { throw 'Installer failed' }
          $exe = Join-Path $destination 'Учёт дилеров.exe'
          if (!(Test-Path $exe)) { throw 'Installed executable missing' }
          node scripts/windows-smoke.cjs "$exe"
          if ($LASTEXITCODE -ne 0) { throw 'Windows launch failed' }
          node scripts/windows-group-filter-smoke.cjs "$exe"
          if ($LASTEXITCODE -ne 0) { throw 'Windows group filter failed' }
          node scripts/windows-interface-smoke.cjs "$exe"
          if ($LASTEXITCODE -ne 0) { throw 'Windows interface failed' }
          node scripts/windows-newmatros-smoke.cjs "$exe"
          if ($LASTEXITCODE -ne 0) { throw 'Windows NewMatRos failed' }
      - name: Upload interface screenshots
        uses: actions/upload-artifact@v4
        with:
          name: appearance-qa-${{ runner.os }}
          path: |
            qa-themes/*.png
            qa-interface/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: stable-${{ runner.os }}
          path: |
            app/dist/*.exe
            app/dist/*.dmg
            app/dist/*.zip
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: stable-*
          merge-multiple: true
          path: release-assets
      - name: Wait for verified server upgrade
        run: node scripts/verify-release-server.cjs
      - name: Generate manifests from verified artifacts
        run: node scripts/release-manifests.cjs
      - name: Publish complete stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./app/package.json').version")
          gh release create "$version" release-assets/* --draft --target "$GITHUB_SHA" --title "Учёт дилеров $version" --notes-file RELEASE_NOTES.md
          gh release edit "$version" --draft=false --latest
      - name: Commit updater manifests
        run: |
          set -euo pipefail
          cp release-assets/latest.json latest.json
          cp release-assets/latest-macos.json latest-macos.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json latest-macos.json
          git commit -m 'Publish verified stable updater manifests [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
