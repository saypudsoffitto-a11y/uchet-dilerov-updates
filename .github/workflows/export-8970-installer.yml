name: Export 8.9.70 Installer Artifact

on:
  push:
    branches:
      - release/8.9.70-final-build
    paths:
      - '.github/workflows/export-8970-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download published setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download 8.9.70 --repo $GITHUB_REPOSITORY --pattern 'Uchet-dilerov-Setup-8.9.70-x64.exe'
      - name: Print current release SHA256
        shell: bash
        run: sha256sum Uchet-dilerov-Setup-8.9.70-x64.exe
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Uchet-dilerov-Setup-8.9.70-x64
          path: Uchet-dilerov-Setup-8.9.70-x64.exe
          if-no-files-found: error
          retention-days: 14
