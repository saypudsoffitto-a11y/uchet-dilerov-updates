name: Publish 8.9.69 Final Windows Release

on:
  push:
    branches:
      - release/8.9.69-final-build
    paths:
      - '.github/workflows/build-8969-final-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/8.9.69-final-build
          fetch-depth: 0

      - name: Download verified Windows 8.9.69 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 36016634212 \
            --repo "$GITHUB_REPOSITORY" \
            --name "Uchet-dilerov-8.9.69-Windows-x64" \
            --dir release-artifacts
          test -f release-artifacts/Uchet-dilerov-Setup-8.9.69-x64.exe
          test -f release-artifacts/Uchet-dilerov-Portable-8.9.69-x64.exe

      - name: Generate update manifest
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(sha256sum release-artifacts/Uchet-dilerov-Setup-8.9.69-x64.exe | awk '{print $1}')
          export SHA
          python - <<'PY'
          import json, os
          manifest = {
              "version": "8.9.69",
              "url": "https://github.com/saypudsoffitto-a11y/uchet-dilerov-updates/releases/download/8.9.69/Uchet-dilerov-Setup-8.9.69-x64.exe",
              "sha256": os.environ["SHA"],
              "notes": "Учёт дилеров 8.9.69 — финальная Windows-сборка с последними исправлениями. Перед установкой программа сохраняет резервную копию данных."
          }
          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          cat latest.json

      - name: Publish GitHub Release 8.9.69
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view 8.9.69 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload 8.9.69 \
              release-artifacts/Uchet-dilerov-Setup-8.9.69-x64.exe \
              release-artifacts/Uchet-dilerov-Portable-8.9.69-x64.exe \
              latest.json \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create 8.9.69 \
              release-artifacts/Uchet-dilerov-Setup-8.9.69-x64.exe \
              release-artifacts/Uchet-dilerov-Portable-8.9.69-x64.exe \
              latest.json \
              --repo "$GITHUB_REPOSITORY" \
              --target "release/8.9.69-final-build" \
              --title "Учёт дилеров 8.9.69" \
              --notes "Финальная Windows-версия 8.9.69. Обновление доступно через встроенную кнопку программы."
          fi

      - name: Switch update button manifest to 8.9.69
        shell: bash
        run: |
          set -euo pipefail
          cp latest.json "$RUNNER_TEMP/latest-8.9.69.json"
          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/latest-8.9.69.json" latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          if git diff --cached --quiet; then
            echo "latest.json already points to 8.9.69"
          else
            git commit -m "Publish Windows 8.9.69 update manifest [skip ci]"
            git push origin main
          fi

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view 8.9.69 --repo "$GITHUB_REPOSITORY" --json tagName,assets --jq '{tag: .tagName, assets: [.assets[].name]}'
