name: Build 8.9.69 Final Windows Release

on:
  push:
    branches:
      - release/8.9.69-final-build
    paths:
      - 'app/**'
      - 'server/**'
      - 'tests/**'
      - '.github/workflows/build-8969-final-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package.json

      - name: Install app build dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Run complete Windows regression suite
        working-directory: app
        run: npm run prebuild:win

      - name: Build Setup and Portable x64
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win

      - name: List release outputs
        shell: pwsh
        run: Get-ChildItem -Path app/dist -Recurse | Select-Object FullName,Length

      - name: Upload Windows 8.9.69 release
        uses: actions/upload-artifact@v4
        with:
          name: Uchet-dilerov-8.9.69-Windows-x64
          path: |
            app/dist/Uchet-dilerov-Setup-8.9.69-x64.exe
            app/dist/Uchet-dilerov-Portable-8.9.69-x64.exe
          if-no-files-found: error
          retention-days: 14
