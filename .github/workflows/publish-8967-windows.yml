name: Build and publish Windows 8.9.67

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'scripts/**'
      - 'RELEASE_NOTES.md'
      - '.github/workflows/publish-8967-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uchet-dilerov-8967-windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify release version
        shell: pwsh
        run: |
          $version = node -p "require('./app/package.json').version"
          if ($version -ne '8.9.67') { throw "Unexpected version: $version" }

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Run full regression suite
        working-directory: app
        run: npm run prebuild:win

      - name: Verify live Turso sync service
        shell: pwsh
        run: |
          $health = Invoke-RestMethod -Uri 'https://uchet-dilerov-sync-8963-test.onrender.com/health' -TimeoutSec 60
          if (-not $health.ok -or $health.storage -ne 'turso' -or $health.protocol -ne 2) {
            throw "Sync service is not ready: $($health | ConvertTo-Json -Compress)"
          }

      - name: Build Windows Setup and Portable
        working-directory: app
        shell: pwsh
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          npm run build:win -- --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install and smoke-test verified Windows build
        shell: pwsh
        run: |
          $version = '8.9.67'
          $setup = (Resolve-Path "app/dist/Uchet-dilerov-Setup-$version-x64.exe").Path
          $exe = $null
          $lastExitCode = $null
          for ($attempt=1; $attempt -le 3; $attempt++) {
            $destination = Join-Path $env:RUNNER_TEMP "uchet-8967-install-$attempt"
            if (Test-Path $destination) { Remove-Item $destination -Recurse -Force -ErrorAction SilentlyContinue }
            $installer = Start-Process -FilePath $setup -ArgumentList @('/S', "/D=$destination") -PassThru
            if (!$installer.WaitForExit(90000)) {
              Stop-Process -Id $installer.Id -Force -ErrorAction SilentlyContinue
              $lastExitCode = 'timeout'
            } else {
              $lastExitCode = $installer.ExitCode
              $candidate = Join-Path $destination 'Учёт дилеров.exe'
              if ($lastExitCode -eq 0 -and (Test-Path $candidate)) { $exe = $candidate; break }
            }
            Start-Sleep -Seconds 3
          }
          if (!$exe) { throw "Installer failed after 3 attempts. Last exit code: $lastExitCode" }
          for ($pass=1; $pass -le 2; $pass++) {
            node scripts/windows-smoke.cjs "$exe"
            if ($LASTEXITCODE -ne 0) { throw "Windows UI smoke pass $pass failed" }
            node scripts/windows-group-filter-smoke.cjs "$exe"
            if ($LASTEXITCODE -ne 0) { throw "Group filter smoke pass $pass failed" }
            node scripts/windows-interface-smoke.cjs "$exe"
            if ($LASTEXITCODE -ne 0) { throw "Interface smoke pass $pass failed" }
            node scripts/windows-newmatros-smoke.cjs "$exe"
            if ($LASTEXITCODE -ne 0) { throw "NewMatRos smoke pass $pass failed" }
          }

      - name: Generate latest.json
        shell: pwsh
        run: |
          $version = '8.9.67'
          $setup = "app/dist/Uchet-dilerov-Setup-$version-x64.exe"
          $sha = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          $notes = (Get-Content 'RELEASE_NOTES.md' -Raw).Trim()
          $manifest = [ordered]@{
            version = $version
            url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$version/Uchet-dilerov-Setup-$version-x64.exe"
            sha256 = $sha
            notes = $notes
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Path 'latest.json' -Encoding utf8

      - name: Publish verified Windows files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '8.9.67'
          gh release view "$version" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$version" --repo "$env:GITHUB_REPOSITORY" --title "Учёт дилеров $version" --notes-file 'RELEASE_NOTES.md'
            if ($LASTEXITCODE -ne 0) {
              Start-Sleep -Seconds 5
              gh release view "$version" --repo "$env:GITHUB_REPOSITORY" *> $null
              if ($LASTEXITCODE -ne 0) { throw "Release $version could not be created or found" }
            }
          }
          $files = @(
            "app/dist/Uchet-dilerov-Setup-$version-x64.exe",
            "app/dist/Uchet-dilerov-Portable-$version-x64.exe",
            "latest.json"
          )
          gh release upload "$version" @files --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }

      - name: Verify published installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '8.9.67'
          New-Item -ItemType Directory -Force -Path published | Out-Null
          gh release download "$version" --repo "$env:GITHUB_REPOSITORY" --pattern "Uchet-dilerov-Setup-$version-x64.exe" --dir published
          if ($LASTEXITCODE -ne 0) { throw 'Published installer download failed' }
          $local = (Get-FileHash "app/dist/Uchet-dilerov-Setup-$version-x64.exe" -Algorithm SHA256).Hash.ToLower()
          $remote = (Get-FileHash "published/Uchet-dilerov-Setup-$version-x64.exe" -Algorithm SHA256).Hash.ToLower()
          if ($local -ne $remote) { throw 'Published installer checksum mismatch' }

      - name: Update main Windows manifest safely
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$env:GITHUB_REPOSITORY/contents/latest.json?ref=main" > current-manifest.json
          $current = Get-Content current-manifest.json -Raw | ConvertFrom-Json
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path 'latest.json'))
          $request = @{
            message = 'Publish verified Windows 8.9.67 update manifest [skip ci]'
            branch = 'main'
            sha = $current.sha
            content = [Convert]::ToBase64String($bytes)
          } | ConvertTo-Json -Depth 4
          Set-Content -Path manifest-request.json -Value $request -Encoding utf8
          gh api --method PUT "repos/$env:GITHUB_REPOSITORY/contents/latest.json" --input manifest-request.json --jq .commit.sha
          if ($LASTEXITCODE -ne 0) { throw 'Manifest update failed' }

      - name: Upload verified Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Uchet-dilerov-8.9.67-Windows-verified
          path: |
            app/dist/Uchet-dilerov-Setup-8.9.67-x64.exe
            app/dist/Uchet-dilerov-Portable-8.9.67-x64.exe
            latest.json
          retention-days: 14
