name: Build and Publish 8.9.71 Product Creation Hotfix

on:
  push:
    branches:
      - release/8.9.71-product-create-hotfix
    paths:
      - '.github/workflows/build-8971-product-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: uchet-dilerov-8971-product-hotfix
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Checkout 8.9.71 hotfix source
        uses: actions/checkout@v4
        with:
          ref: release/8.9.71-product-create-hotfix
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package.json

      - name: Install build dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Run complete regression suite
        working-directory: app
        run: npm run prebuild:win

      - name: Build Setup and Portable x64
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: npm run build:win -- --publish never

      - name: Install and smoke-test built application
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'app/dist/Uchet-dilerov-Setup-8.9.71-x64.exe').Path
          $destination = Join-Path $env:RUNNER_TEMP 'uchet-8971-smoke'
          if (Test-Path $destination) { Remove-Item $destination -Recurse -Force -ErrorAction SilentlyContinue }
          $installer = Start-Process -FilePath $setup -ArgumentList @('/S', "/D=$destination") -PassThru
          if (!$installer.WaitForExit(90000)) { Stop-Process -Id $installer.Id -Force -ErrorAction SilentlyContinue; throw 'Installer timed out' }
          if ($installer.ExitCode -ne 0) { throw "Installer exited with code $($installer.ExitCode)" }
          $exe = Join-Path $destination 'Учёт дилеров.exe'
          if (!(Test-Path $exe)) { throw 'Installed application was not found' }
          node scripts/windows-product-create-smoke.cjs "$exe"
          if ($LASTEXITCODE -ne 0) { throw 'Product creation smoke failed' }
          node scripts/windows-interface-smoke.cjs "$exe"
          if ($LASTEXITCODE -ne 0) { throw 'Interface smoke failed' }
          node scripts/windows-newmatros-smoke.cjs "$exe"
          if ($LASTEXITCODE -ne 0) { throw 'NewMatRos smoke failed' }

      - name: Generate verified update manifest
        shell: pwsh
        run: |
          $setup = 'app/dist/Uchet-dilerov-Setup-8.9.71-x64.exe'
          $sha = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          $manifest = [ordered]@{
            version = '8.9.71'
            url = 'https://github.com/saypudsoffitto-a11y/uchet-dilerov-updates/releases/download/8.9.71/Uchet-dilerov-Setup-8.9.71-x64.exe'
            sha256 = $sha
            notes = 'Учёт дилеров 8.9.71 — исправлено создание товара и защита новой карточки от исчезновения при первой синхронизации.'
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Path 'latest.json' -Encoding utf8
          Get-Content latest.json

      - name: Publish GitHub Release 8.9.71
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 8.9.71 `
            'app/dist/Uchet-dilerov-Setup-8.9.71-x64.exe' `
            'app/dist/Uchet-dilerov-Portable-8.9.71-x64.exe' `
            'latest.json' `
            --repo $env:GITHUB_REPOSITORY `
            --target 'release/8.9.71-product-create-hotfix' `
            --title 'Учёт дилеров 8.9.71' `
            --notes 'Hotfix: товар создаётся без обязательной группы, пустые цены сохраняются как 0, список сразу показывает новый товар, а первая синхронизация больше не стирает только что созданную карточку.'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload verified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Uchet-dilerov-8.9.71-Windows-x64
          path: |
            app/dist/Uchet-dilerov-Setup-8.9.71-x64.exe
            app/dist/Uchet-dilerov-Portable-8.9.71-x64.exe
            latest.json
          if-no-files-found: error
          retention-days: 14

# rerun after making 8.9.70 regression checks forward-compatible
