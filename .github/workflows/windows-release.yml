name: Build and publish Windows release

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'RELEASE_NOTES.md'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uchet-dilerov-windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read version
        id: meta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (!(Test-Path 'app/package.json')) { throw 'app/package.json not found' }
          $version = node -p "require('./app/package.json').version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $tags = @(gh release list --repo "$env:GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName')
          if ($tags -contains $version) {
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Release $version already exists."
          } else {
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Release $version does not exist. Building it."
          }

      - name: Install dependencies
        if: steps.meta.outputs.exists != 'true'
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Build Windows Setup and Portable
        if: steps.meta.outputs.exists != 'true'
        working-directory: app
        shell: pwsh
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          npm run build:win -- --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install and launch Windows application three times before publication
        if: steps.meta.outputs.exists != 'true'
        shell: pwsh
        run: |
          $version = '${{ steps.meta.outputs.version }}'
          $setup = (Resolve-Path "app/dist/Uchet-dilerov-Setup-$version-x64.exe").Path
          $installedExe = $null
          $lastExitCode = $null

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $destination = Join-Path $env:RUNNER_TEMP "uchet-smoke-install-$attempt"
            if (Test-Path $destination) { Remove-Item $destination -Recurse -Force -ErrorAction SilentlyContinue }
            Write-Host "Starting silent installation attempt $attempt"
            $installer = Start-Process -FilePath $setup -ArgumentList @('/S', "/D=$destination") -PassThru
            if (!$installer.WaitForExit(60000)) {
              try { Stop-Process -Id $installer.Id -Force -ErrorAction SilentlyContinue } catch {}
              $lastExitCode = 'timeout'
              Write-Warning "Installer attempt $attempt timed out"
            } else {
              $lastExitCode = $installer.ExitCode
              Write-Host "Installer attempt $attempt finished with code $lastExitCode"
              $candidate = Join-Path $destination 'Учёт дилеров.exe'
              if ($lastExitCode -eq 0 -and (Test-Path $candidate)) {
                $installedExe = $candidate
                break
              }
            }
            Start-Sleep -Seconds 3
          }

          if (!$installedExe) { throw "Installer failed after 3 attempts. Last exit code: $lastExitCode" }
          for ($pass = 1; $pass -le 3; $pass++) {
            Write-Host "Installed application UI smoke pass $pass of 3"
            node scripts/windows-smoke.cjs "$installedExe"
            if ($LASTEXITCODE -ne 0) { throw "Windows UI smoke pass $pass failed" }
            node scripts/windows-group-filter-smoke.cjs "$installedExe"
            if ($LASTEXITCODE -ne 0) { throw "Windows product group filter smoke pass $pass failed" }
          }

      - name: Generate latest.json
        if: steps.meta.outputs.exists != 'true'
        shell: pwsh
        run: |
          $version = '${{ steps.meta.outputs.version }}'
          $setup = "app/dist/Uchet-dilerov-Setup-$version-x64.exe"
          if (!(Test-Path $setup)) { throw "Setup not found: $setup" }
          $sha = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          $notes = if (Test-Path 'RELEASE_NOTES.md') { (Get-Content 'RELEASE_NOTES.md' -Raw).Trim() } else { "Обновление версии $version" }
          $manifest = [ordered]@{
            version = $version
            url = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/Uchet-dilerov-Setup-$version-x64.exe"
            sha256 = $sha
            notes = $notes
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Path 'latest.json' -Encoding utf8

      - name: Publish GitHub Release
        if: steps.meta.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.meta.outputs.version }}'
          $setup = "app/dist/Uchet-dilerov-Setup-$version-x64.exe"
          $portable = "app/dist/Uchet-dilerov-Portable-$version-x64.exe"
          $files = @($setup, 'latest.json')
          if (Test-Path $portable) { $files += $portable }
          gh release create "$version" @files --repo "$env:GITHUB_REPOSITORY" --title "Учёт дилеров $version" --notes-file 'RELEASE_NOTES.md' --target "$env:GITHUB_SHA"

      - name: Save latest.json to main
        if: steps.meta.outputs.exists != 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Update latest.json for ${{ steps.meta.outputs.version }} [skip ci]"
          git push
