name: Apply 8.9.11 NewMatRos pricing fixes

on:
  push:
    branches: [main]
    paths:
      - 'FIX_8_9_11_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch NewMatRos pricing and corner rules
        shell: bash
        run: |
          cat > /tmp/patch.js <<'NODE'
          const fs=require('fs');
          const p='app/index.html';
          let s=fs.readFileSync(p,'utf8');

          const newBuild=`function nmFindRollWidth(data){
            let z=data['Заказ']||{},c=[];
            ['ШиринаРулона','ШиринаМатериала','МатериалШирина','Ширина','ШиринаПолотна','ШиринаПленки','ШиринаПлёнки','МатериалШиринаРулона','ШиринаРулонаМатериала'].forEach(k=>{if(z[k]!=null&&z[k]!=='')c.push(z[k])});
            Object.values(data||{}).forEach(sec=>{if(sec&&typeof sec==='object')Object.entries(sec).forEach(([k,v])=>{if(/ширин|рулон|width/i.test(k)&&v!=null&&v!=='')c.push(v)})});
            function normWidth(v){let m=String(v??'').replace(',','.').match(/(\\d+(?:\\.\\d+)?)/);if(!m)return 0;let n=+m[1];if(n>1000)n/=1000;else if(n>10)n/=100;return n>=1&&n<=10?n:0}
            for(let v of c){let n=normWidth(v);if(n)return n}return 0
          }
          function nmBuildItems(data){
            let z=data['Заказ']||{},p=nmPrices(),items=[];
            function add(article,name,qty,price,unit){qty=nmNum(qty);price=nmNum(price);if(qty>0&&price>0)items.push({productId:null,article,name,qty,price,buyPrice:0,total:qty*price,profit:0,unit,source:'NewMatRos'})}
            let width=nmFindRollWidth(data);
            let matPrice=width>0&&width<=3.60?(p.materialNarrow||p.material):width>=3.80?(p.materialWide||p.material):(p.material||0);
            if(!matPrice&&width===0){if(p.materialNarrow&&!p.materialWide)matPrice=p.materialNarrow;else if(p.materialWide&&!p.materialNarrow)matPrice=p.materialWide}
            let widthTag=width?(' · рулон '+width+' м'+(width<=3.60?' · узкая плёнка':width>=3.80?' · широкая плёнка':' · стандартная ширина')):' · ширина рулона не определена';
            let area=nmNum(z['КоличествоПродукция']);
            if(area>0)items.push({productId:null,article:'NM-MAT',name:'Полотно: '+(z['МатериалКаталог']||z['МатериалМатериал']||'Материал')+widthTag,qty:area,price:nmNum(matPrice),buyPrice:0,total:area*nmNum(matPrice),profit:0,unit:'м²',source:'NewMatRos'});
            let wasteQty=z['ДеловойОтход']||z['КоличествоДеловойОтход']||z['КоличествоДеловогоОтхода']||z['ПлощадьДеловогоОтхода']||z['ДеловойОтходПлощадь'];add('NM-WASTE','Деловой отход',wasteQty,p.businessWaste,'м²');
            add('NM-GARP','Гарпун: '+(z['МатериалГарпун']||'гарпун'),z['КоличествоГарпун'],p.harpoon,'м');
            let corners=nmNum(z['КоличествоУглов']),extraCorners=Math.max(0,corners-4);add('NM-CORNER','Дополнительные углы (с 5-го)',extraCorners,50,'шт');
            add('NM-CURVE','Криволинейные участки',z['ПериметрКривых'],p.curve,'м');
            add('NM-CUT','Вырезы',z['ПериметрВырезов'],p.cutout,'м');
            add('NM-SEAM','Швы',z['ДлинаШвов'],p.seam,'м');
            add('NM-FIX','Доп. крепёж',z['КоличествоКрепежа']||z['КоличествоКреплений'],p.fixed,'шт');
            return items
          }
          function nmOrderKey`;

          const re=/function nmBuildItems\(data\)\{[\s\S]*?\n\}\nfunction nmOrderKey/;
          if(!re.test(s)) throw new Error('nmBuildItems block not found');
          s=s.replace(re,newBuild);

          s=s.replace('<label>Деловой отход, ₽/м²<input id="nmPriceBusinessWaste" type="number" step="0.01" min="0"></label><label>Узкая плёнка ≤ 3,60 м, ₽/м²<input id="nmPriceMaterialNarrow" type="number" step="0.01" min="0"></label><label>Широкая плёнка ≥ 3,80 м, ₽/м²<input id="nmPriceMaterialWide" type="number" step="0.01" min="0"></label>',
          '<label>Материал по умолчанию, ₽/м²<input id="nmPriceMaterial" type="number" step="0.01" min="0"></label><label>Деловой отход, ₽/м²<input id="nmPriceBusinessWaste" type="number" step="0.01" min="0"></label><label>Узкая плёнка ≤ 3,60 м, ₽/м²<input id="nmPriceMaterialNarrow" type="number" step="0.01" min="0"></label><label>Широкая плёнка ≥ 3,80 м, ₽/м²<input id="nmPriceMaterialWide" type="number" step="0.01" min="0"></label>');
          s=s.replace('<label>Угол, ₽/шт<input id="nmPriceCorner" type="number" step="0.01" min="0"></label>','<label>Доп. угол с 5-го — фиксировано 50 ₽/шт<input id="nmPriceCorner" type="number" value="50" readonly></label>');

          s=s.replace("state.newmatros.prices={material:+(state.newmatros.prices&&state.newmatros.prices.material)||0,businessWaste:+nmPriceBusinessWaste.value||0,materialNarrow:+nmPriceMaterialNarrow.value||0,materialWide:+nmPriceMaterialWide.value||0,harpoon:+nmPriceHarpoon.value||0,corner:+nmPriceCorner.value||0,curve:+nmPriceCurve.value||0,cutout:+nmPriceCutout.value||0,seam:+nmPriceSeam.value||0,fixed:+nmPriceFixed.value||0};",
          "state.newmatros.prices={material:+nmPriceMaterial.value||0,businessWaste:+nmPriceBusinessWaste.value||0,materialNarrow:+nmPriceMaterialNarrow.value||0,materialWide:+nmPriceMaterialWide.value||0,harpoon:+nmPriceHarpoon.value||0,corner:50,curve:+nmPriceCurve.value||0,cutout:+nmPriceCutout.value||0,seam:+nmPriceSeam.value||0,fixed:+nmPriceFixed.value||0};");
          s=s.replace("function renderNewMatRosSettings(){let p=nmPrices();nmPriceBusinessWaste.value=p.businessWaste||0;nmPriceMaterialNarrow.value=p.materialNarrow||0;nmPriceMaterialWide.value=p.materialWide||0;nmPriceHarpoon.value=p.harpoon||0;nmPriceCorner.value=p.corner||0;",
          "function renderNewMatRosSettings(){let p=nmPrices();nmPriceMaterial.value=p.material||0;nmPriceBusinessWaste.value=p.businessWaste||0;nmPriceMaterialNarrow.value=p.materialNarrow||0;nmPriceMaterialWide.value=p.materialWide||0;nmPriceHarpoon.value=p.harpoon||0;nmPriceCorner.value=50;");

          s=s.replace("let total=nmPreviewItems.reduce((s,i)=>s+i.total,0);if(total<=0)return alert('Сумма заказа 0 ₽. Сначала укажи цены NewMatRos.');",
          "let missingMaterial=nmPreviewItems.find(i=>i.article==='NM-MAT'&&i.qty>0&&i.price<=0);if(missingMaterial)return alert('Не задана цена материала. Открой «Цены для автоматического расчёта» и укажи цену материала/узкой/широкой плёнки.');let total=nmPreviewItems.reduce((s,i)=>s+i.total,0);if(total<=0)return alert('Сумма заказа 0 ₽. Сначала укажи цены NewMatRos.');");

          s=s.replaceAll('версия 8.9.10','версия 8.9.11').replaceAll('v8.9.10','v8.9.11');
          fs.writeFileSync(p,s,'utf8');

          const pkg=JSON.parse(fs.readFileSync('app/package.json','utf8'));
          pkg.version='8.9.11';
          fs.writeFileSync('app/package.json',JSON.stringify(pkg,null,2)+'\n');
          fs.writeFileSync('RELEASE_NOTES.md','Исправлен расчёт NewMatRos: материал теперь отображается и считается по цене материала с более надёжным определением ширины рулона. Добавлена цена материала по умолчанию для случаев, когда ширина не передана. Первые 4 угла входят в стоимость потолка; оплачиваются только углы начиная с 5-го — по 50 ₽ за каждый дополнительный угол.\n');
          NODE
          node /tmp/patch.js

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html app/package.json RELEASE_NOTES.md
          git commit -m "Fix NewMatRos material and corner pricing for 8.9.11"
          git push
