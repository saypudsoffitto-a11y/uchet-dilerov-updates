<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#183e37"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="/mobile/manifest.json"><link rel="stylesheet" href="/mobile/style.css"><title>Учёт дилеров</title></head><body><header><span class="brand">SOFFITTO</span><h1>Учёт дилеров</h1><p>Мобильный кабинет</p></header><main><p id="status" role="status">Подключение…</p><section id="login" hidden><h2>Вход в кабинет</h2><p>Используйте отдельный пароль мобильного доступа.</p><form id="loginForm"><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><button>Войти</button></form></section><section id="cabinet" hidden><div class="toolbar"><button id="refresh" class="secondary">Обновить</button><button id="logout" class="secondary">Выйти</button></div><section class="metric"><small>Принято сегодня · все устройства</small><strong id="today">—</strong></section><nav><button id="tabDealers">Дилеры</button><button id="tabHistory" class="secondary">История</button></nav><section id="dealersView"><div class="toolbar"><h2>Дилеры</h2><button id="newDealer" class="secondary">＋ Добавить</button></div><label>Поиск<input id="search" type="search" placeholder="Имя или телефон" autocomplete="off"></label><div id="dealers"></div></section><section id="historyView" hidden><h2>История операций</h2><div id="history"></div></section><section id="pending"><h2>Ожидают отправки</h2><div id="queue"></div><button id="retry" class="secondary">Повторить отправку</button></section></section></main><dialog id="payment"><form id="paymentForm"><h2>Внести оплату</h2><p id="recipient"></p><label>Сумма, ₽<input name="amount" inputmode="decimal" required placeholder="0,00"></label><label>Способ оплаты<select name="method"><option>Наличные</option><option>Перевод</option></select></label><label>Комментарий<input name="note" maxlength="1000"></label><button>Сохранить оплату</button><button type="button" class="secondary" id="cancelPayment">Отмена</button></form></dialog><dialog id="dealer"><form id="dealerForm"><h2>Новый дилер</h2><label>Имя / название<input name="name" maxlength="120" required></label><label>Телефон<input name="phone" type="tel" required autocomplete="tel" placeholder="+7"></label><label>Город<input name="city" maxlength="120"></label><button>Создать карточку</button><button type="button" class="secondary" id="cancelDealer">Отмена</button></form></dialog><script src="/mobile/app.js" defer></script></body></html>
